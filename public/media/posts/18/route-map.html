var B={minLat:33.0,maxLat:39.1,minLng:124.4,maxLng:130.2};
var PADX=30,PADY=26;
function proj(lat,lng){
  var spanLng=(B.maxLng-B.minLng)*COSLAT, spanLat=B.maxLat-B.minLat;
  var availW=W-PADX*2, availH=H-PADY*2;
  var s=Math.min(availW/spanLng, availH/spanLat);
  var ox=(availW-spanLng*s)/2+PADX, oy=(availH-spanLat*s)/2+PADY;
  return [ox+(lng-B.minLng)*COSLAT*s, oy+(B.maxLat-lat)*s];
}

// ── Route geometry: cumulative lengths for smooth travel ──
var RT=GEO.route, SEG=[], TOTAL=0;
function buildRoute(){
  SEG=[];TOTAL=0;
  for(var i=0;i<RT.length-1;i++){
    var a=proj(RT[i][0],RT[i][1]),b=proj(RT[i+1][0],RT[i+1][1]);
    var d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    SEG.push({a:a,b:b,d:d});TOTAL+=d;
  }
}
function routePoint(t){ // t 0..1 → [x,y,angle]
  var target=t*TOTAL,acc=0;
  for(var i=0;i<SEG.length;i++){
    var s=SEG[i];
    if(acc+s.d>=target){
      var f=(target-acc)/s.d;
      return [s.a[0]+(s.b[0]-s.a[0])*f, s.a[1]+(s.b[1]-s.a[1])*f, Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0])];
    }
    acc+=s.d;
  }
  var L=SEG[SEG.length-1];
  return [L.b[0],L.b[1],0];
}

// ── Boats + gulls for life ──
var BOATS=[{lat:34.6,lng:125.8,ph:0},{lat:36.4,lng:129.9,ph:2.2},{lat:33.9,lng:127.8,ph:4.1}];
var GULLS=[{lat:37.8,lng:125.4,ph:1},{lat:34.2,lng:129.5,ph:3}];

// ── Animation state ──
var T0=null, RIDE_MS=6000, rideT=0, done=false;
function restart(){T0=null;rideT=0;done=false;}
document.getElementById('replay').addEventListener('click',restart);

function drawPoly(poly){
  ctx.beginPath();
  for(var i=0;i<poly.length;i++){
    var p=proj(poly[i][1],poly[i][0]);
    i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);
  }
  ctx.closePath();
}

function frame(ts){
  if(!T0)T0=ts;
  var now=ts, el=now-T0;
  rideT=Math.min(el/RIDE_MS,1);
  if(rideT>=1)done=true;

  ctx.save();ctx.scale(DPR,DPR);
  // ── SEA: layered gradient + slow animated swell bands ──
  var sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#BDE9F7');sg.addColorStop(.5,'#8ED4EE');sg.addColorStop(1,'#5FBBDD');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  // swell highlights drifting
  ctx.save();ctx.globalAlpha=.10;ctx.strokeStyle='#fff';ctx.lineWidth=1.4;
  for(var wv=0;wv<14;wv++){
    var wy=(wv/14)*H + Math.sin(now/2600+wv)*5;
    var off=(now/90 + wv*47)% (W+120) -60;
    ctx.beginPath();
    ctx.moveTo(off-26,wy);
    ctx.bezierCurveTo(off-13,wy-4,off+13,wy+4,off+26,wy);
    ctx.stroke();
  }
  ctx.restore();
  // faint graticule
  ctx.save();ctx.globalAlpha=.06;ctx.strokeStyle='#0a4a66';ctx.lineWidth=1;
  for(var la=33;la<=39;la++){var p1=proj(la,B.minLng),p2=proj(la,B.maxLng);ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.stroke();}
  for(var lo=125;lo<=130;lo++){var q1=proj(B.maxLat,lo),q2=proj(B.minLat,lo);ctx.beginPath();ctx.moveTo(q1[0],q1[1]);ctx.lineTo(q2[0],q2[1]);ctx.stroke();}
  ctx.restore();

  // ── NORTH KOREA: muted context ──
  ctx.save();
  GEO.nk.forEach(function(poly){drawPoly(poly);ctx.fillStyle='#D6DFCE';ctx.fill();ctx.strokeStyle='rgba(120,140,120,.5)';ctx.lineWidth=1;ctx.stroke();});
  ctx.restore();

  // ── SOUTH KOREA: coastal shadow → white casing → land fill ──
  ctx.save();ctx.shadowColor='rgba(6,60,90,.28)';ctx.shadowBlur=14;ctx.shadowOffsetY=3;
  GEO.kr.forEach(function(poly){drawPoly(poly);ctx.fillStyle='#fff';ctx.fill();});
  ctx.restore();
  GEO.kr.forEach(function(poly){
    drawPoly(poly);
    var lg=ctx.createLinearGradient(0,0,W*.7,H);
    lg.addColorStop(0,'#CDEBA6');lg.addColorStop(.5,'#B4E08F');lg.addColorStop(1,'#9AD378');
    ctx.fillStyle=lg;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle='rgba(30,90,60,.35)';ctx.lineWidth=.8;ctx.stroke();
  });

  // ── Relief: Taebaek (east spine) + Sobaek (center) ranges ──
  ctx.save();
  GEO.kr.forEach(function(poly){drawPoly(poly);});ctx.clip();
  function ridge(pts,alpha,width){
    ctx.beginPath();
    pts.forEach(function(p,i){var xy=proj(p[0],p[1]);i===0?ctx.moveTo(xy[0],xy[1]):ctx.lineTo(xy[0],xy[1]);});
    ctx.strokeStyle='rgba(70,130,70,'+alpha+')';ctx.lineWidth=width;ctx.lineCap='round';
    ctx.filter='blur(7px)';ctx.stroke();ctx.filter='none';
  }
  ridge([[38.6,128.3],[38.0,128.6],[37.4,128.9],[36.9,129.0],[36.4,129.05]], .5, 22); // Taebaek
  ridge([[36.9,128.0],[36.7,128.15],[36.4,128.0],[36.0,127.8],[35.7,127.7]], .42, 18); // Sobaek
  ridge([[35.4,127.6],[35.3,127.8],[35.25,128.1]], .35, 14); // Jirisan
  // sunlit lowlands
  ctx.fillStyle='rgba(255,250,190,.18)';
  ctx.beginPath();ctx.ellipse(proj(36.8,126.8)[0],proj(36.8,126.8)[1],W*.09,H*.13,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(proj(35.9,126.9)[0],proj(35.9,126.9)[1],W*.08,H*.10,0,0,7);ctx.fill();
  ctx.restore();

  // ── DMZ hint ──
  ctx.save();ctx.setLineDash([4,5]);ctx.strokeStyle='rgba(150,60,60,.35)';ctx.lineWidth=1.4;
  ctx.beginPath();
  [[38.30,124.9],[37.95,126.65],[38.12,127.1],[38.30,127.9],[38.61,128.36]].forEach(function(p,i){
    var xy=proj(p[0],p[1]);i===0?ctx.moveTo(xy[0],xy[1]):ctx.lineTo(xy[0],xy[1]);
  });
  ctx.stroke();ctx.restore();

  // ── Sea labels + boats + gulls ──
  ctx.save();ctx.fillStyle='rgba(10,74,102,.4)';
  ctx.font='italic 600 '+Math.max(10,W*.016)+'px Georgia,serif';ctx.textAlign='center';
  var yl=proj(36.2,125.2);ctx.fillText('Yellow Sea',yl[0],yl[1]);
  var sj=proj(37.4,129.9);ctx.save();ctx.translate(sj[0],sj[1]);ctx.rotate(Math.PI/2);ctx.fillText('East Sea',0,0);ctx.restore();
  var ks=proj(34.0,128.4);ctx.fillText('Korea Strait',ks[0],ks[1]);
  ctx.restore();
  BOATS.forEach(function(b0){
    var p=proj(b0.lat,b0.lng);var bob=Math.sin(now/900+b0.ph)*2.5;
    ctx.font=Math.max(11,W*.016)+'px serif';ctx.textAlign='center';
    ctx.fillText('⛵',p[0]+Math.sin(now/4000+b0.ph)*8,p[1]+bob);
  });
  GULLS.forEach(function(g){
    var p=proj(g.lat,g.lng);var fl=Math.sin(now/500+g.ph);
    ctx.save();ctx.strokeStyle='rgba(40,70,90,.5)';ctx.lineWidth=1.4;ctx.lineCap='round';
    var gx=p[0]+Math.sin(now/5000+g.ph)*14, gy=p[1]+Math.cos(now/6000+g.ph)*8;
    ctx.beginPath();ctx.moveTo(gx-5,gy);ctx.quadraticCurveTo(gx-2,gy-3-fl*2,gx,gy);
    ctx.quadraticCurveTo(gx+2,gy-3-fl*2,gx+5,gy);ctx.stroke();ctx.restore();
  });

  // ── City labels ──
  LABELS.forEach(function(l){
    var p=proj(l.ll[0],l.ll[1]);
    ctx.save();
    ctx.font='italic '+(l.big?'700 ':'600 ')+Math.max(10,W*(l.big?.020:.016))+'px Georgia,serif';
    ctx.textAlign='left';
    ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=3.5;
    ctx.strokeText(l.text,p[0]+7,p[1]-6);
    ctx.fillStyle='#124258';ctx.fillText(l.text,p[0]+7,p[1]-6);
    ctx.beginPath();ctx.arc(p[0],p[1],2.4,0,7);ctx.fillStyle='#124258';ctx.fill();
    ctx.restore();
  });

  // ── ROUTE: animated draw ──
  var drawLen=rideT*TOTAL,acc2=0;
  function pathTo(len){
    ctx.beginPath();var a0=SEG[0].a;ctx.moveTo(a0[0],a0[1]);var acc=0;
    for(var i=0;i<SEG.length;i++){
      var s=SEG[i];
      if(acc+s.d<=len){ctx.lineTo(s.b[0],s.b[1]);acc+=s.d;}
      else{var f=(len-acc)/s.d;ctx.lineTo(s.a[0]+(s.b[0]-s.a[0])*f,s.a[1]+(s.b[1]-s.a[1])*f);break;}
    }
  }
  // full route ghost (faint)
  ctx.save();ctx.globalAlpha=.22;pathTo(TOTAL);
  ctx.strokeStyle='#0891B2';ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.lineCap='round';ctx.stroke();ctx.restore();
  // ridden: white casing + gradient
  ctx.save();ctx.setLineDash([]);
  pathTo(drawLen);ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  var rg=ctx.createLinearGradient(proj(37.5,127.1)[0],0,proj(35.1,129)[0],0);
  rg.addColorStop(0,'#00C9A7');rg.addColorStop(1,'#0891B2');
  pathTo(drawLen);ctx.strokeStyle=rg;ctx.lineWidth=3.6;ctx.stroke();
  ctx.restore();

  // ── Checkpoints pop in as bike passes ──
  CPS.forEach(function(c){
    if(rideT>=c.t){
      var age=Math.min((rideT-c.t)*RIDE_MS/280,1);
      var p=proj(c.ll[0],c.ll[1]);
      var r=5.5*(0.4+0.6*(1-Math.pow(1-age,3)));
      var over=age<1? (1-age)*5:0;
      ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=4;
      ctx.beginPath();ctx.arc(p[0],p[1],r+over,0,7);
      ctx.fillStyle='#fff';ctx.fill();
      ctx.strokeStyle='#0891B2';ctx.lineWidth=2.4;ctx.setLineDash([]);ctx.stroke();ctx.restore();
    }
  });

  // ── Bike or trophy at head ──
  var hp=routePoint(rideT);
  if(!done){
    ctx.save();ctx.font=Math.max(14,W*.020)+'px serif';ctx.textAlign='center';
    ctx.translate(hp[0],hp[1]-3);
    ctx.fillText('🚴',0,0);
    ctx.restore();
    // dust puffs
    for(var d0=1;d0<=2;d0++){
      var tp=routePoint(Math.max(0,rideT-.012*d0));
      ctx.save();ctx.globalAlpha=.25/d0;ctx.beginPath();ctx.arc(tp[0],tp[1],2.4/d0+1,0,7);
      ctx.fillStyle='#7aa';ctx.fill();ctx.restore();
    }
  } else {
    var pulse=(Math.sin(now/620)*.5+.5);
    ctx.save();
    ctx.beginPath();ctx.arc(hp[0],hp[1],11+pulse*15,0,7);
    ctx.strokeStyle='rgba(8,145,178,'+(0.45-pulse*.38)+')';ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();
    ctx.beginPath();ctx.arc(hp[0],hp[1],11+pulse*26,0,7);
    ctx.strokeStyle='rgba(0,201,167,'+(0.22-pulse*.19)+')';ctx.lineWidth=1.4;ctx.stroke();
    ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(hp[0],hp[1],11,0,7);ctx.fillStyle='#0891B2';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2.4;ctx.stroke();
    ctx.shadowBlur=0;
    ctx.font=Math.max(11,W*.017)+'px serif';ctx.textAlign='center';
    ctx.fillText('🏆',hp[0],hp[1]+4);
    ctx.restore();
  }

  // ── Compass ──
  ctx.save();ctx.globalAlpha=.55;
  var cx0=PADX+8,cy0=PADY+16,cr=Math.max(10,W*.016);
  ctx.fillStyle='#0891B2';
  ctx.beginPath();ctx.moveTo(cx0,cy0-cr);ctx.lineTo(cx0-cr*.32,cy0+cr*.25);ctx.lineTo(cx0+cr*.32,cy0+cr*.25);ctx.closePath();ctx.fill();
  ctx.fillStyle='#9dbecb';
  ctx.beginPath();ctx.moveTo(cx0,cy0+cr);ctx.lineTo(cx0-cr*.32,cy0-cr*.25+cr*.5);ctx.lineTo(cx0+cr*.32,cy0-cr*.25+cr*.5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#124258';ctx.font='bold '+Math.max(9,cr*.8)+'px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('N',cx0,cy0-cr-4);
  ctx.restore();

  ctx.restore(); // DPR

  // progress UI
  var km=Math.round(rideT*633);
  pfill.style.width=(rideT*100)+'%';
  plbl.textContent=done?'633 km · 100% complete 🏆':km+' km';

  requestAnimationFrame(frame);
}

function resize(){
  var r=cvs.getBoundingClientRect();
  DPR=window.devicePixelRatio||1;W=r.width;H=r.height;
  cvs.width=W*DPR;cvs.height=H*DPR;
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  buildRoute();
}
new ResizeObserver(resize).observe(cvs);
resize();
requestAnimationFrame(frame);

// tooltips
cvs.addEventListener('mousemove',function(e){
  var r=cvs.getBoundingClientRect();
  var mx=e.clientX-r.left,my=e.clientY-r.top,hit=null,best=24;
  CPS.forEach(function(c){
    var p=proj(c.ll[0],c.ll[1]);
    var d=Math.hypot(mx-p[0],my-p[1]);
    if(d<best){best=d;hit=c;}
  });
  if(hit){
    tip.style.display='block';
    tip.innerHTML='<b>'+hit.name+'</b><small>'+hit.sub+'</small>';
    var tx=mx+14,ty=my-10;
    if(tx+180>W)tx=mx-190;if(ty+50>H)ty=my-54;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  }else tip.style.display='none';
});
cvs.addEventListener('mouseleave',function(){tip.style.display='none';});
</script>
</body>
</html>
